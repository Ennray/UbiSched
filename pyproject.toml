[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubisched"
version = "2.1.0"
description = "Graph based cooperative UAV sensing and compute scheduling"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
models = ["torch>=2.6"]
dev = ["pytest>=8", "PyYAML>=6"]

[project.scripts]
ubisched = "ubisched.__main__:main"

[tool.setuptools.packages.find]
include = ["ubisched*", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
